services:
  postgres:
    image: postgres:16-alpine
    container_name: data-board-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: data_board
    ports:
      - "5432:5432"
    volumes:
      - data-board-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: data-board-redis
    ports:
      - "6379:6379"

  data-board:
    build: .
    container_name: data-board
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      DB_TYPE: postgres
      POSTGRES_URL: postgres://postgres:postgres@postgres:5432/data_board
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  data-board-pgdata:
